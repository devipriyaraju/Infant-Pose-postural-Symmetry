[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infant-pose-symmetry"
version = "0.1.0"
description = "Infant pose estimation and postural symmetry assessment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Devipriya Raju"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "Pillow>=9.5",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "pycocotools>=2.0.7",
  "torch>=2.1"
]

[project.optional-dependencies]
pose = [
  "openmim>=0.3.9",
  "mmengine>=0.10",
  "mmpose>=1.2"
]
deploy = [
  "onnx>=1.15",
  "onnxruntime-gpu>=1.17"
]
dev = [
  "pytest>=7.4",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
